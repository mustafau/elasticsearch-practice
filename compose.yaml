name: elasticsearch-practice
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # The fixtures use supplied vectors, not ML jobs or hosted models.
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' | grep -q '\"timed_out\":false'"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.6
    profiles: [kibana]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: --max-old-space-size=768
    mem_limit: 1g
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://localhost:5601/api/status > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    depends_on:
      elasticsearch:
        condition: service_healthy
volumes:
  elasticsearch-data:
