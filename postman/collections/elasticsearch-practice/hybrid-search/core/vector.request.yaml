$kind: http-request
name: vector
description: POST /lab-hybrid-search-read/_search. Exercise vector; inspect the assertion for controlled expected
  results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-hybrid-search-read/_search'
order: 2000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 10,
      "timeout": "2s",
      "_source": [
        "passage_id",
        "document_id",
        "title",
        "body"
      ],
      "knn": {
        "field": "embedding",
        "query_vector": [
          1.0,
          0.0,
          0.0,
          0.0
        ],
        "k": 10,
        "num_candidates": 20,
        "filter": {
          "bool": {
            "filter": [
              {
                "term": {
                  "tenant_id": "acme"
                }
              },
              {
                "terms": {
                  "allowed_principals": [
                    "user:alice",
                    "group:engineering",
                    "tenant:acme:all"
                  ]
                }
              }
            ]
          }
        }
      },
      "sort": [
        {
          "_score": "desc"
        },
        {
          "passage_id": "asc"
        }
      ]
    }
scripts:
- type: beforeRequest
  language: text/javascript
  code: |
    if(!pm.collectionVariables.get("hybridLexicalIds")) throw new Error("Run lexical first for the ordered RRF comparison");
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('vector semantics', function () {
    pm.expect(ids).to.include("hybrid-paraphrase");
    pm.expect(ids).to.include("hybrid-exact");
    pm.expect(ids.indexOf("hybrid-paraphrase")).to.be.below(ids.indexOf("hybrid-exact"));
    pm.expect(ids).not.to.include("hybrid-private");
    pm.expect(ids).not.to.include("hybrid-other-tenant");
    const lexical=JSON.parse(pm.collectionVariables.get('hybridLexicalIds'));
    pm.collectionVariables.set('hybridVectorIds',JSON.stringify(ids));
    const ranks=new Map();
    for(const [branch,list] of [['lexical',lexical],['vector',ids]]) {
     const seen=new Set();
     list.forEach((id,i)=>{if(seen.has(id))return;seen.add(id);const row=ranks.get(id)||{id,score:0,ranks:{}};row.ranks[branch]=i+1;row.score+=1/(60+i+1);ranks.set(id,row);});
    }
    const fused=[...ranks.values()].sort((a,b)=>b.score-a.score || (a.id<b.id ? -1 : a.id>b.id ? 1 : 0));
    pm.expect(fused[0].id).to.equal('hybrid-exact');
    pm.expect(fused[0].score).to.be.closeTo(1/61+1/62,1e-12);
    pm.expect(fused[0].ranks).to.eql({lexical:1,vector:2});
    console.log('RRF constant=60',fused);

    });
