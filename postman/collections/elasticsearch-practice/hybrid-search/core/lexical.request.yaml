$kind: http-request
name: lexical
description: POST /lab-hybrid-search-read/_search. Exercise lexical; inspect the assertion for controlled expected
  results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-hybrid-search-read/_search'
order: 1000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 10,
      "track_total_hits": true,
      "timeout": "2s",
      "_source": [
        "passage_id",
        "document_id",
        "title",
        "body"
      ],
      "query": {
        "bool": {
          "must": [
            {
              "multi_match": {
                "query": "reset password",
                "fields": [
                  "title^3",
                  "body"
                ],
                "operator": "and"
              }
            }
          ],
          "filter": [
            {
              "term": {
                "tenant_id": "acme"
              }
            },
            {
              "terms": {
                "allowed_principals": [
                  "user:alice",
                  "group:engineering",
                  "tenant:acme:all"
                ]
              }
            }
          ],
          "boost": 1.0
        }
      },
      "sort": [
        {
          "_score": "desc"
        },
        {
          "passage_id": "asc"
        }
      ]
    }
scripts:
- type: beforeRequest
  language: text/javascript
  code: |
    pm.collectionVariables.unset("hybridLexicalIds");
    pm.collectionVariables.unset("hybridVectorIds");
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('lexical semantics', function () {
    pm.expect([...ids].sort()).to.eql(["hybrid-exact"]);
    pm.expect(ids).not.to.include("hybrid-private");
    pm.expect(ids).not.to.include("hybrid-other-tenant");
    pm.collectionVariables.set("hybridLexicalIds",JSON.stringify(ids));
    });
