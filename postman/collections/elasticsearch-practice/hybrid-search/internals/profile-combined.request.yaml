$kind: http-request
name: profile-combined
description: POST /lab-hybrid-search-read/_search. Exercise profile combined; inspect the assertion for controlled
  expected results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-hybrid-search-read/_search'
order: 3000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 5,
      "track_total_hits": true,
      "timeout": "2s",
      "_source": [
        "passage_id",
        "document_id",
        "title",
        "body"
      ],
      "query": {
        "bool": {
          "must": [
            {
              "multi_match": {
                "query": "reset password",
                "fields": [
                  "title^3",
                  "body"
                ],
                "operator": "and"
              }
            }
          ],
          "filter": [
            {
              "term": {
                "tenant_id": "acme"
              }
            },
            {
              "terms": {
                "allowed_principals": [
                  "user:alice",
                  "group:engineering",
                  "tenant:acme:all"
                ]
              }
            }
          ],
          "boost": 1.0
        }
      },
      "sort": [
        {
          "_score": "desc"
        },
        {
          "passage_id": "asc"
        }
      ],
      "knn": {
        "field": "embedding",
        "query_vector": [
          1.0,
          0.0,
          0.0,
          0.0
        ],
        "k": 10,
        "num_candidates": 20,
        "filter": {
          "bool": {
            "filter": [
              {
                "term": {
                  "tenant_id": "acme"
                }
              },
              {
                "terms": {
                  "allowed_principals": [
                    "user:alice",
                    "group:engineering",
                    "tenant:acme:all"
                  ]
                }
              }
            ]
          }
        },
        "boost": 0.5
      },
      "profile": true
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('profile-combined semantics', function () {
    pm.expect(ids).to.include("hybrid-exact");
    pm.expect(ids).to.include("hybrid-paraphrase");
    pm.expect(body.profile.shards.length).to.be.above(0);
    });
