$kind: http-request
name: warehouse-case
description: Search with the committed warehouse-packing query and vector. The warehouse passage should rank
  first among authorized results.
method: POST
url: '{{esUrl}}/lab-hybrid-search-read/_search'
order: 5000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 10,
      "timeout": "2s",
      "_source": [
        "passage_id",
        "document_id",
        "title",
        "body"
      ],
      "knn": {
        "field": "embedding",
        "query_vector": [
          0,
          1,
          0,
          0
        ],
        "k": 10,
        "num_candidates": 20,
        "filter": {
          "bool": {
            "filter": [
              {
                "term": {
                  "tenant_id": "acme"
                }
              },
              {
                "terms": {
                  "allowed_principals": [
                    "user:alice",
                    "group:engineering",
                    "tenant:acme:all"
                  ]
                }
              }
            ]
          }
        }
      },
      "sort": [
        {
          "_score": "desc"
        },
        {
          "passage_id": "asc"
        }
      ]
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('warehouse-case semantics', function () {
    pm.expect(ids[0]).to.equal("hybrid-unrelated");
    pm.expect(ids).not.to.include("hybrid-private");
    pm.expect(ids).not.to.include("hybrid-other-tenant");
    });
