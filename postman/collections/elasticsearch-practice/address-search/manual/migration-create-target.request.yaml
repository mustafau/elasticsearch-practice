$kind: http-request
name: migration-create-target
description: 'Pause writes before this sequence. Explicit target settings/mappings are required: reindex does not
  copy them. Existing target is an intentional error; reset removes owned migration indices.'
method: PUT
url: '{{esUrl}}/lab-address-search-v2-000001'
order: 2000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "settings": {
        "number_of_shards": 1,
        "number_of_replicas": 0,
        "refresh_interval": "1s",
        "analysis": {
          "analyzer": {
            "address_search": {
              "type": "custom",
              "tokenizer": "standard",
              "filter": [
                "lowercase",
                "asciifolding"
              ]
            }
          }
        }
      },
      "mappings": {
        "dynamic": "strict",
        "properties": {
          "place_id": {
            "type": "keyword"
          },
          "name": {
            "type": "keyword"
          },
          "label": {
            "type": "keyword"
          },
          "address_line": {
            "type": "keyword"
          },
          "city": {
            "type": "keyword"
          },
          "city_id": {
            "type": "keyword"
          },
          "region_code": {
            "type": "keyword"
          },
          "postal_code": {
            "type": "keyword"
          },
          "country_code": {
            "type": "keyword"
          },
          "place_type": {
            "type": "keyword"
          },
          "location": {
            "type": "geo_point"
          },
          "popularity": {
            "type": "integer"
          },
          "search_text": {
            "type": "search_as_you_type",
            "analyzer": "address_search",
            "max_shingle_size": 3
          },
          "updated_at": {
            "type": "date"
          }
        }
      }
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('migration-create-target semantics', function () {
    pm.expect(body.acknowledged).to.equal(true);
    });
