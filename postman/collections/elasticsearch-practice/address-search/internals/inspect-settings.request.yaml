$kind: http-request
name: inspect-settings
description: GET /lab-address-search-read/_settings. Exercise inspect settings; inspect the assertion for controlled
  expected results and vary one literal parameter to compare behavior.
method: GET
url: '{{esUrl}}/lab-address-search-read/_settings'
order: 6000
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('inspect-settings semantics', function () {
    for(const state of Object.values(body)) {pm.expect(state.settings.index.number_of_shards).to.equal("1");pm.expect(state.settings.index.number_of_replicas).to.equal("0");}
    });
