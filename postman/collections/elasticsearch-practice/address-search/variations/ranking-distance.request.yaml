$kind: http-request
name: ranking-distance
description: POST /lab-address-search-read/_search. Exercise ranking distance; inspect the assertion for controlled
  expected results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-address-search-read/_search'
order: 11000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 20,
      "track_total_hits": true,
      "timeout": "250ms",
      "_source": [
        "place_id",
        "name",
        "label",
        "place_type",
        "city_id",
        "country_code",
        "location"
      ],
      "query": {
        "bool": {
          "must": [
            {
              "multi_match": {
                "query": "ranking test p",
                "type": "bool_prefix",
                "fields": [
                  "search_text",
                  "search_text._2gram",
                  "search_text._3gram"
                ],
                "operator": "and"
              }
            }
          ],
          "filter": [
            {
              "term": {
                "country_code": "US"
              }
            },
            {
              "geo_distance": {
                "distance": "25000m",
                "distance_type": "arc",
                "location": {
                  "lat": 37.7936,
                  "lon": -122.3958
                }
              }
            }
          ]
        }
      },
      "sort": [
        {
          "_geo_distance": {
            "location": {
              "lat": 37.7936,
              "lon": -122.3958
            },
            "order": "asc",
            "unit": "m",
            "distance_type": "arc"
          }
        },
        {
          "_score": "desc"
        },
        {
          "place_id": "asc"
        }
      ],
      "track_scores": true
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('ranking-distance semantics', function () {
    pm.expect(ids).to.include("sf-ranking-near");
    pm.expect(ids).to.include("sf-ranking-far");
    pm.expect(ids.indexOf("sf-ranking-near")).to.be.below(ids.indexOf("sf-ranking-far"));
    });
