$kind: http-request
name: popularity-text
description: POST /lab-address-search-read/_search. Exercise popularity text; inspect the assertion for controlled
  expected results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-address-search-read/_search'
order: 13000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 20,
      "track_total_hits": true,
      "timeout": "250ms",
      "_source": [
        "place_id",
        "name",
        "label",
        "place_type",
        "city_id",
        "country_code",
        "location"
      ],
      "query": {
        "bool": {
          "must": [
            {
              "multi_match": {
                "query": "popularity test p",
                "type": "bool_prefix",
                "fields": [
                  "search_text",
                  "search_text._2gram",
                  "search_text._3gram"
                ],
                "operator": "and"
              }
            }
          ],
          "filter": [
            {
              "term": {
                "country_code": "US"
              }
            },
            {
              "geo_distance": {
                "distance": "25000m",
                "distance_type": "arc",
                "location": {
                  "lat": 37.7936,
                  "lon": -122.3958
                }
              }
            }
          ]
        }
      },
      "sort": [
        {
          "_score": "desc"
        },
        {
          "place_id": "asc"
        }
      ]
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('popularity-text semantics', function () {
    pm.expect(ids).to.include("sf-popular-high");
    pm.expect(ids).to.include("sf-popular-low");
    pm.expect(ids.indexOf("sf-popular-high")).to.be.below(ids.indexOf("sf-popular-low"));
    pm.expect(hits[0]._score).to.be.closeTo(hits[1]._score,0.000001);
    });
