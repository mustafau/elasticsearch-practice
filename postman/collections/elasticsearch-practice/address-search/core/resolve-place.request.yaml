$kind: http-request
name: resolve-place
description: POST /lab-address-search-read/_search. Exercise resolve place; inspect the assertion for controlled
  expected results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-address-search-read/_search'
order: 4000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 1,
      "query": {
        "bool": {
          "filter": [
            {
              "ids": {
                "values": [
                  "sf-ferry-building"
                ]
              }
            },
            {
              "term": {
                "country_code": "US"
              }
            }
          ]
        }
      }
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('resolve-place semantics', function () {
    pm.expect([...ids].sort()).to.eql(["sf-ferry-building"]);
    });
