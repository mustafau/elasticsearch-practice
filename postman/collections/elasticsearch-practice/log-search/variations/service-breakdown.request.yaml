$kind: http-request
name: service-breakdown
description: POST /lab-log-search-events/_search. Exercise service breakdown; inspect the assertion for controlled
  expected results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-log-search-events/_search'
order: 2000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 0,
      "query": {
        "bool": {
          "filter": [
            {
              "term": {
                "environment": "prod"
              }
            }
          ]
        }
      },
      "aggs": {
        "services": {
          "terms": {
            "field": "service",
            "size": 10
          }
        }
      }
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('service-breakdown semantics', function () {
    pm.expect(body.aggregations.services.buckets.map(b=>b.key).sort()).to.eql(["dispatch","identity","payments"]);
    });
