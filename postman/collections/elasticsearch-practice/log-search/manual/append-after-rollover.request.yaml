$kind: http-request
name: append-after-rollover
description: PUT /lab-log-search-events/_create/manual-after-rollover?refresh=wait_for. Exercise append after rollover;
  inspect the assertion for controlled expected results and vary one literal parameter to compare behavior.
method: PUT
url: '{{esUrl}}/lab-log-search-events/_create/manual-after-rollover?refresh=wait_for'
queryParams:
- key: refresh
  value: wait_for
order: 4000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "@timestamp": "2026-01-01T12:10:00Z",
      "event_id": "manual-after-rollover",
      "message": "upstream timeout",
      "service": "payments",
      "environment": "prod",
