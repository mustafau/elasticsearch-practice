$kind: http-request
name: bulk-ingestion-failures
description: POST /_bulk?refresh=wait_for. Exercise bulk ingestion failures; inspect the assertion for controlled
  expected results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/_bulk?refresh=wait_for'
queryParams:
- key: refresh
  value: wait_for
order: 1000
headers:
- key: Content-Type
  value: application/x-ndjson
body:
  type: text
  content: |
    {"create": {"_index": "lab-log-search-events", "_id": "invalid-timestamp"}}
    {"@timestamp": "yesterday", "event_id": "invalid-timestamp", "message": "upstream timeout", "service": "payments", "environment": "prod", "severity": "error", "trace_id": "trace-known", "http_status": 503, "duration_ms": 5000.0, "labels": {"region": "us-west", "build": "fixture-v1"}}
    {"create": {"_index": "lab-log-search-events", "_id": "invalid-numeric"}}
    {"@timestamp": "2026-01-01T12:00:00Z", "event_id": "invalid-numeric", "message": "upstream timeout", "service": "payments", "environment": "prod", "severity": "error", "trace_id": "trace-known", "http_status": 503, "duration_ms": "not-a-number", "labels": {"region": "us-west", "build": "fixture-v1"}}
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('bulk-ingestion-failures semantics', function () {
    pm.expect(body.errors).to.equal(true);
    pm.expect(body.items.length).to.equal(2);
    for(const item of body.items) { pm.expect(item.create.status).to.be.at.least(400); pm.expect(item.create.error).to.exist; }
    });
