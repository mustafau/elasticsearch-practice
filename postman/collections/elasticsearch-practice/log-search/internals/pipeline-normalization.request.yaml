$kind: http-request
name: pipeline-normalization
description: Validate an ISO timestamp and lowercase severity while preserving the original timestamp's milliseconds.
method: POST
url: '{{esUrl}}/_ingest/pipeline/lab-log-search-ingest/_simulate'
order: 2000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "docs": [
        {
          "_source": {
            "@timestamp": "2026-01-01T12:00:00.123Z",
            "event_id": "pay-00",
            "message": "upstream timeout",
            "service": "payments",
            "environment": "prod",
            "severity": "ERROR",
            "trace_id": "trace-known",
            "http_status": 503,
            "duration_ms": 5000.0,
            "labels": {
              "region": "us-west",
              "build": "fixture-v1"
            }
          }
        }
      ]
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('pipeline-normalization semantics', function () {
    pm.expect(body.docs[0].doc._source.severity).to.equal("error");
    pm.expect(body.docs[0].doc._source["@timestamp"]).to.equal("2026-01-01T12:00:00.123Z");
    });
