$kind: http-request
name: timeout-search
description: POST /lab-log-search-events/_search. Exercise timeout search; inspect the assertion for controlled
  expected results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-log-search-events/_search'
order: 1000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 20,
      "track_total_hits": true,
      "timeout": "2s",
      "query": {
        "bool": {
          "must": [
            {
              "match": {
                "message": "timeout"
              }
            }
          ],
          "filter": [
            {
              "term": {
                "environment": "prod"
              }
            },
            {
              "term": {
                "service": "payments"
              }
            },
            {
              "range": {
                "@timestamp": {
                  "gte": "2026-01-01T12:00:00Z",
                  "lt": "2026-01-01T12:05:00Z"
                }
              }
            }
          ]
        }
      },
      "sort": [
        {
          "@timestamp": "desc"
        },
        {
          "event_id": "asc"
        }
      ]
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('timeout-search semantics', function () {
    pm.expect([...ids].sort()).to.eql(["pay-00", "pay-01", "pay-02"]);
    });
