$kind: http-request
name: pit-open
description: POST /lab-log-search-events/_pit?keep_alive=1m. Exercise pit open; inspect the assertion for controlled
  expected results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-log-search-events/_pit?keep_alive=1m'
queryParams:
- key: keep_alive
  value: 1m
order: 3000
scripts:
- type: beforeRequest
  language: text/javascript
  code: |+
    pm.collectionVariables.unset("logPitId");
    pm.collectionVariables.unset("logSearchAfter");
    pm.collectionVariables.unset("logSeenIds");

- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('pit-open semantics', function () {
    pm.expect(body.id).to.be.a("string");
    pm.collectionVariables.set("logPitId",body.id);
    pm.collectionVariables.set("logSeenIds","[]");
    });
