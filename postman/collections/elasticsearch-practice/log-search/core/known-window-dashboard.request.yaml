$kind: http-request
name: known-window-dashboard
description: POST /lab-log-search-events/_search. Exercise known window dashboard; inspect the assertion for controlled
  expected results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-log-search-events/_search'
order: 2000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 0,
      "track_total_hits": true,
      "query": {
        "bool": {
          "filter": [
            {
              "term": {
                "environment": "prod"
              }
            },
            {
              "term": {
                "service": "payments"
              }
            },
            {
              "range": {
                "@timestamp": {
                  "gte": "2026-01-01T12:00:00Z",
                  "lt": "2026-01-01T12:05:00Z"
                }
              }
            }
          ]
        }
      },
      "aggs": {
        "minutes": {
          "date_histogram": {
            "field": "@timestamp",
            "fixed_interval": "1m",
            "time_zone": "UTC",
            "min_doc_count": 0,
            "extended_bounds": {
              "min": "2026-01-01T12:00:00Z",
              "max": "2026-01-01T12:04:00Z"
            }
          }
        },
        "errors": {
          "filter": {
            "term": {
              "severity": "error"
            }
          }
        },
        "average_duration": {
          "avg": {
            "field": "duration_ms"
          }
        },
        "duration_percentiles": {
          "percentiles": {
            "field": "duration_ms",
            "percents": [
              50,
              95,
              99
            ]
          }
        }
      }
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('known-window-dashboard semantics', function () {
    pm.expect(body.hits.total.value).to.equal(10);
    pm.expect(body.aggregations.errors.doc_count).to.equal(3);
    pm.expect(body.aggregations.errors.doc_count/body.hits.total.value).to.equal(0.3);
    pm.expect(body.aggregations.minutes.buckets.map(b=>b.doc_count)).to.eql([2,2,2,2,2]);
    pm.expect(body.aggregations.average_duration.value).to.equal(1517.5);
    });
