$kind: http-request
name: exact-product-id
description: POST /lab-ecommerce-search-read/_search. Exercise exact product id; inspect the assertion for controlled
  expected results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-ecommerce-search-read/_search'
order: 2000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 1,
      "query": {
        "term": {
          "product_id": "shoe-cross-variant"
        }
      }
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('exact-product-id semantics', function () {
    pm.expect([...ids].sort()).to.eql(["shoe-cross-variant"]);
    });
