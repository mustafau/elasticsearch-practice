$kind: http-request
name: nested-variant-filter
description: POST /lab-ecommerce-search-read/_search. Exercise nested variant filter; inspect the assertion for
  controlled expected results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-ecommerce-search-read/_search'
order: 1000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 10,
      "track_total_hits": true,
      "timeout": "2s",
      "query": {
        "bool": {
          "must": [
            {
              "multi_match": {
                "query": "running shoe",
                "fields": [
                  "title^3",
                  "description"
                ],
                "operator": "and"
              }
            }
          ],
          "filter": [
            {
              "term": {
                "category_id": "running-shoes"
              }
            },
            {
              "nested": {
                "path": "variants",
                "score_mode": "none",
                "query": {
                  "bool": {
                    "filter": [
                      {
                        "term": {
                          "variants.color": "red"
                        }
                      },
                      {
                        "term": {
                          "variants.size": "L"
                        }
                      },
                      {
                        "range": {
                          "variants.price_cents": {
                            "lte": 10000
                          }
                        }
                      },
                      {
                        "range": {
                          "variants.stock_qty": {
                            "gt": 0
                          }
                        }
                      }
                    ]
                  }
                },
                "inner_hits": {
                  "name": "matching_variants",
                  "size": 5
                }
              }
            }
          ]
        }
      },
      "aggs": {
        "brands": {
          "terms": {
            "field": "brand",
            "size": 20
          }
        },
        "categories": {
          "terms": {
            "field": "category_id",
            "size": 20
          }
        }
      },
      "sort": [
        {
          "_score": "desc"
        },
        {
          "product_id": "asc"
        }
      ]
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('nested-variant-filter semantics', function () {
    pm.expect([...ids].sort()).to.eql(["shoe-other-brand", "shoe-valid-red-l"]);
    pm.expect(body.hits.total.value).to.equal(2);
    pm.expect(body.aggregations.brands.buckets.map(b => [b.key,b.doc_count]).sort()).to.eql([["acme",1],["stride",1]]);
    for (const h of hits) for (const v of h.inner_hits.matching_variants.hits.hits) { pm.expect(v._source.color).to.equal("red"); pm.expect(v._source.size).to.equal("L"); pm.expect(v._source.stock_qty).to.be.above(0); }
    });
