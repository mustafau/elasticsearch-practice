$kind: http-request
name: sku-versus-product-counts
description: POST /lab-ecommerce-search-read/_search. Exercise sku versus product counts; inspect the assertion
  for controlled expected results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-ecommerce-search-read/_search'
order: 4000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 0,
      "track_total_hits": true,
      "timeout": "2s",
      "query": {
        "bool": {
          "must": [
            {
              "multi_match": {
                "query": "running shoe",
                "fields": [
                  "title^3",
                  "description"
                ],
                "operator": "and"
              }
            }
          ],
          "filter": [
            {
              "term": {
                "category_id": "running-shoes"
              }
            },
            {
              "nested": {
                "path": "variants",
                "score_mode": "none",
                "query": {
                  "bool": {
                    "filter": [
                      {
                        "term": {
                          "variants.color": "red"
                        }
                      },
                      {
                        "term": {
                          "variants.size": "L"
                        }
                      },
                      {
                        "range": {
                          "variants.price_cents": {
                            "lte": 10000
                          }
                        }
                      },
                      {
                        "range": {
                          "variants.stock_qty": {
                            "gt": 0
                          }
                        }
                      }
                    ]
                  }
                },
                "inner_hits": {
                  "name": "matching_variants",
                  "size": 5
                }
              }
            }
          ]
        }
      },
      "aggs": {
        "variants": {
          "nested": {
            "path": "variants"
          },
          "aggs": {
            "matching": {
              "filter": {
                "bool": {
                  "filter": [
                    {
                      "term": {
                        "variants.color": "red"
                      }
                    },
                    {
                      "term": {
                        "variants.size": "L"
                      }
                    },
                    {
                      "range": {
                        "variants.price_cents": {
                          "lte": 10000
                        }
                      }
                    },
                    {
                      "range": {
                        "variants.stock_qty": {
                          "gt": 0
                        }
                      }
                    }
                  ]
                }
              },
              "aggs": {
                "products": {
                  "reverse_nested": {}
                }
              }
            }
          }
        }
      },
      "sort": [
        {
          "_score": "desc"
        },
        {
          "product_id": "asc"
        }
      ]
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('sku-versus-product-counts semantics', function () {
    pm.expect(body.hits.total.value).to.equal(2);
    pm.expect(body.aggregations.variants.matching.doc_count).to.equal(3);
    pm.expect(body.aggregations.variants.matching.products.doc_count).to.equal(2);
    });
