$kind: http-request
name: explain-valid-product
description: POST /lab-ecommerce-search-read/_explain/shoe-valid-red-l. Exercise explain valid product; inspect
  the assertion for controlled expected results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-ecommerce-search-read/_explain/shoe-valid-red-l'
order: 2000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "query": {
        "bool": {
          "must": [
            {
              "multi_match": {
                "query": "running shoe",
                "fields": [
                  "title^3",
                  "description"
                ],
                "operator": "and"
              }
            }
          ],
          "filter": [
            {
              "term": {
                "category_id": "running-shoes"
              }
            },
            {
              "nested": {
                "path": "variants",
                "score_mode": "none",
                "query": {
                  "bool": {
                    "filter": [
                      {
                        "term": {
                          "variants.color": "red"
                        }
                      },
                      {
                        "term": {
                          "variants.size": "L"
                        }
                      },
                      {
                        "range": {
                          "variants.price_cents": {
                            "lte": 10000
                          }
                        }
                      },
                      {
                        "range": {
                          "variants.stock_qty": {
                            "gt": 0
                          }
                        }
                      }
                    ]
                  }
                },
                "inner_hits": {
                  "name": "matching_variants",
                  "size": 5
                }
              }
            }
          ]
        }
      }
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('explain-valid-product semantics', function () {
    pm.expect(body.matched).to.equal(true);
    });
