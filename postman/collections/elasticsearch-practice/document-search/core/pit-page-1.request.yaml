$kind: http-request
name: pit-page-1
description: Stable page 1, size two. Keep the identical query/sort, latest PIT ID and entire final-hit sort array
  including the implicit PIT tie breaker. The following close request runs even after assertion failures in the
  default runner.
method: POST
url: '{{esUrl}}/_search'
order: 5000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 2,
      "track_total_hits": true,
      "query": {
        "bool": {
          "must": [
            {
              "multi_match": {
                "query": "deployment guide",
                "fields": [
                  "title^4",
                  "body"
                ],
                "operator": "and"
              }
            }
          ],
          "filter": [
            {
              "term": {
                "tenant_id": "acme"
              }
            },
            {
              "terms": {
                "allowed_principals": [
                  "user:alice",
                  "group:engineering",
                  "tenant:acme:all"
                ]
              }
            }
          ]
        }
      },
      "sort": [
        {
          "_score": "desc"
        },
        {
          "document_id": "asc"
        }
      ],
      "pit": {
        "id": "{{documentPitId}}",
        "keep_alive": "1m"
      }
    }
scripts:
- type: beforeRequest
  language: text/javascript
  code: |
    if(!pm.collectionVariables.get('documentPitId')) throw new Error('Run PIT open first');
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('pit-page-1 semantics', function () {
    pm.expect(body.hits.total.value).to.equal(3);
    pm.expect(body.pit_id).to.be.a('string');
    pm.collectionVariables.set('documentPitId',body.pit_id);
    const seen=JSON.parse(pm.collectionVariables.get('documentSeenIds'));
    for (const id of ids) pm.expect(seen).not.to.include(id);
    seen.push(...ids);
    pm.collectionVariables.set('documentSeenIds',JSON.stringify(seen));
    if(hits.length) pm.collectionVariables.set('documentSearchAfter',JSON.stringify(hits[hits.length-1].sort));

    });
