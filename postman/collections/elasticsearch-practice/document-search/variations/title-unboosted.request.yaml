$kind: http-request
name: title-unboosted
description: POST /lab-document-search-read/_search. Exercise title unboosted; inspect the assertion for controlled
  expected results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-document-search-read/_search'
order: 9000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 10,
      "track_total_hits": true,
      "timeout": "2s",
      "_source": [
        "document_id",
        "title",
        "document_type",
        "updated_at"
      ],
      "query": {
        "bool": {
          "must": [
            {
              "multi_match": {
                "query": "rollout handbook",
                "fields": [
                  "title",
                  "body"
                ],
                "operator": "and"
              }
            }
          ],
          "filter": [
            {
              "term": {
                "tenant_id": "acme"
              }
            },
            {
              "terms": {
                "allowed_principals": [
                  "user:alice",
                  "group:engineering",
                  "tenant:acme:all"
                ]
              }
            }
          ]
        }
      },
      "highlight": {
        "pre_tags": [
          "<mark>"
        ],
        "post_tags": [
          "</mark>"
        ],
        "fields": {
          "title": {},
          "body": {
            "fragment_size": 120,
            "number_of_fragments": 2
          }
        }
      },
      "aggs": {
        "types": {
          "terms": {
            "field": "document_type",
            "size": 10
          }
        }
      },
      "sort": [
        {
          "_score": "desc"
        },
        {
          "document_id": "asc"
        }
      ]
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('title-unboosted semantics', function () {
    pm.expect([...ids].sort()).to.eql(["boost-body", "boost-title"]);
    console.log('Unboosted order and scores',hits.map(h=>[h._id,h._score]));
    });
