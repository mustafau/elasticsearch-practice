$kind: http-request
name: deny-missing-allowlist
description: Resolve a document owned by Alice with an absent allowlist. Ownership grants nothing; the same tenant/principal
  filters deny access.
method: POST
url: '{{esUrl}}/lab-document-search-read/_search'
order: 4500
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |
    {
      "size": 1,
      "track_total_hits": true,
      "timeout": "2s",
      "_source": [
        "document_id",
        "title",
        "document_type",
        "updated_at"
      ],
      "query": {
        "bool": {
          "must": [
            {
              "ids": {
                "values": [
                  "document-16"
                ]
              }
            }
          ],
          "filter": [
            {
              "term": {
                "tenant_id": "acme"
              }
            },
            {
              "terms": {
                "allowed_principals": [
                  "user:alice",
                  "group:engineering",
                  "tenant:acme:all"
                ]
              }
            }
          ]
        }
      },
      "sort": [
        {
          "_score": "desc"
        },
        {
          "document_id": "asc"
        }
      ]
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('deny-missing-allowlist semantics', function () {
    pm.expect([...ids].sort()).to.eql([]);
    });
