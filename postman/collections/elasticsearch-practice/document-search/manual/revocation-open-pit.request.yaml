$kind: http-request
name: revocation-open-pit
description: POST /lab-document-search-read/_pit?keep_alive=1m. Exercise revocation open pit; inspect the assertion
  for controlled expected results and vary one literal parameter to compare behavior.
method: POST
url: '{{esUrl}}/lab-document-search-read/_pit?keep_alive=1m'
queryParams:
- key: keep_alive
  value: 1m
order: 1000
scripts:
- type: beforeRequest
  language: text/javascript
  code: |
    pm.collectionVariables.unset("documentPitId");
- type: afterResponse
  language: text/javascript
  code: |
    const body = pm.response.json();
    const hits = body.hits ? body.hits.hits : [];
    const ids = hits.map(hit => hit._id);
    pm.test('HTTP status and complete Elasticsearch response', function () {
      pm.expect([200, 201]).to.include(pm.response.code);
      if (body.timed_out !== undefined) pm.expect(body.timed_out).to.equal(false);
      if (body._shards) pm.expect(body._shards.failed).to.equal(0);
    });
    pm.test('revocation-open-pit semantics', function () {
    pm.collectionVariables.set("documentPitId",body.id);
    });
